[pytest]
testpaths = tests
# Without this, `pytest` (bare, not `python -m pytest`) can't import `rag` --
# tests/ has no __init__.py, so pytest's default rootdir-insertion never adds
# the project root to sys.path. docker-compose.yml's tests service always
# used `python -m pytest`, which masks this (`-m` adds the cwd itself), so
# it never showed up until CI ran plain `pytest -v`.
pythonpath = .
