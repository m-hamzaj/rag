# Prerequisite: the Day 1 Documents API must already be running separately
# (its own `docker compose up -d` in the documents-api project), with
# Day 3's articles already crawled into it. This project's containers
# reach it via host.docker.internal:8000, not localhost, which inside a
# container means the container itself.
#
# Run:
#   1) (in documents-api/)  docker compose up -d
#   2) (in this project)    docker compose up -d db
#   3) (in this project)    docker compose run --rm ingest
#   4) (in this project)    docker compose run --rm ask "some question"
#      or just              docker compose run --rm ask       # interactive

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Host port 5433, not 5432 -- Day 1's own Postgres already claims
      # 5432 on the host, and both projects' databases may be running at
      # the same time.
      - "5433:5432"
    volumes:
      - rag_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    command: ["python", "-m", "rag.ingest"]
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      DOCUMENTS_API_BASE_URL: ${DOCUMENTS_API_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  ask:
    build: .
    command: ["python", "-m", "rag.cli"]
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      # Not enforced at the compose-file level (a required-var error here
      # would block every service, including ingest/tests, which don't
      # need a Groq key at all) -- rag/generate.py raises a clear error at
      # call time instead, only when an answer is actually being generated.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "pytest", "-v"]

volumes:
  rag_db_data:
