# Prerequisite: the Day 1 Documents API must already be running separately
# (its own `docker compose up -d` in the documents-api project), with
# Day 3's articles already crawled into it. This project's containers
# reach it via host.docker.internal:8000, not localhost, which inside a
# container means the container itself.
#
# Run:
#   1) (in documents-api/)  docker compose up -d
#   2) (in this project)    docker compose up -d db
#   3) (in this project)    docker compose run --rm ingest
#   4) (in this project)    docker compose run --rm ask python -m rag.cli "some question"
#      or just              docker compose run --rm ask python -m rag.cli   # interactive
#      (the full "python -m rag.cli ..." is required -- `docker compose run`
#      replaces the service's default command rather than appending to it)
#   5) (in this project)    docker compose up -d ui   # dashboard at http://localhost:8082

services:
  # ChromaDB -- originally Postgres/pgvector, per the brief; switched on
  # the team's call afterward. See README for the reasoning and what
  # changed. Pinned to the same version as the Python client in
  # requirements.txt -- client/server version drift is a real source of
  # API incompatibilities with Chroma.
  db:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # Host port 8001, not Chroma's own default of 8000 -- Day 1's API
      # already claims 8000 on the host, and both may run at the same time.
      - "8001:8000"
    volumes:
      - rag_chroma_data:/data
    healthcheck:
      # No curl/wget/python in this image -- Chroma's server is a Rust
      # binary now, not the Python app the old healthcheck assumed. bash
      # (which IS present) can still open a raw TCP connection via
      # /dev/tcp, which is a good enough proxy for "the server is up and
      # listening" without needing a real HTTP client in the container.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000 && exec 3<&-'"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    command: ["python", "-m", "rag.ingest"]
    environment:
      CHROMA_HOST: db
      CHROMA_PORT: "8000"
      DOCUMENTS_API_BASE_URL: ${DOCUMENTS_API_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  ask:
    build: .
    command: ["python", "-m", "rag.cli"]
    stdin_open: true
    tty: true
    environment:
      CHROMA_HOST: db
      CHROMA_PORT: "8000"
      # Not enforced at the compose-file level (a required-var error here
      # would block every service, including ingest/tests, which don't
      # need a Groq key at all) -- rag/generate.py raises a clear error at
      # call time instead, only when an answer is actually being generated.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8080", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      # Host port 8082 -- Day 1's API has 8000, this project's own Chroma
      # has 8001, and Day 3's dashboard already claims 8080, so this one
      # needs its own free slot to run alongside all three.
      - "8082:8080"
    environment:
      CHROMA_HOST: db
      CHROMA_PORT: "8000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "pytest", "-v"]

volumes:
  rag_chroma_data:
