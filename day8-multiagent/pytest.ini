[pytest]
testpaths = tests
# Same reasoning as day4-rag/pytest.ini: tests/ has no __init__.py, so bare
# `pytest` needs pythonpath=. to import `agents`/`baseline` at all -- masked
# under docker-compose's `python -m pytest`, which adds the cwd itself, so
# it only shows up under a plain `pytest -v` (e.g. CI).
pythonpath = .
