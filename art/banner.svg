<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f6f7fb; }
    .border { stroke: #d8dbe6; }
    .title { fill: #14151a; }
    .subtitle { fill: #4a4d5c; }
    .footer { fill: #8b8fa3; }
    .chip-bg { fill: #ffffff; stroke: #d8dbe6; }
    .chip-text { fill: #4a4d5c; }
    .glow-a { stop-color: #6d5bff; }
    .glow-b { stop-color: #22d3ee; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0c10; }
      .border { stroke: #23252f; }
      .title { fill: #f5f6fa; }
      .subtitle { fill: #a7abc0; }
      .footer { fill: #5c6079; }
      .chip-bg { fill: #14151c; stroke: #262838; }
      .chip-text { fill: #c3c6d6; }
      .glow-a { stop-color: #7c6cff; }
      .glow-b { stop-color: #35e6ff; }
    }
  </style>

  <defs>
    <radialGradient id="glowA" cx="15%" cy="20%" r="55%">
      <stop offset="0%" class="glow-a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="90%" cy="85%" r="55%">
      <stop offset="0%" class="glow-b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="glow-a"/>
      <stop offset="100%" class="glow-b"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="1" width="1198" height="298" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="1" y="1" width="1198" height="298" rx="20" class="bg"/>
    <rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#glowA)"/>
    <rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#glowB)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="20" fill="none" class="border" stroke-width="1.5"/>

  <text x="72" y="118" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700" fill="url(#titleGrad)">rag</text>
  <text x="72" y="150" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="500" class="subtitle">retrieval-augmented Q&amp;A over 125 scraped articles</text>
  <text x="72" y="178" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="16" class="subtitle">chunk &#8594; embed &#8594; retrieve &#8594; cite &#8594; agent, evaluated at every step</text>

  <g font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(72,206)">
      <rect width="98" height="32" rx="16" class="chip-bg" stroke-width="1"/>
      <circle cx="20" cy="16" r="6" fill="#3572A5"/>
      <text x="34" y="21" class="chip-text">Python</text>
    </g>
    <g transform="translate(182,206)">
      <rect width="128" height="32" rx="16" class="chip-bg" stroke-width="1"/>
      <text x="16" y="21" class="chip-text">ChromaDB</text>
    </g>
    <g transform="translate(322,206)">
      <rect width="102" height="32" rx="16" class="chip-bg" stroke-width="1"/>
      <text x="16" y="21" class="chip-text">Groq</text>
    </g>
    <g transform="translate(436,206)">
      <rect width="150" height="32" rx="16" class="chip-bg" stroke-width="1"/>
      <text x="16" y="21" class="chip-text">LangChain agent</text>
    </g>
  </g>

  <text x="72" y="268" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="14" class="footer">github.com/m-hamzaj/rag</text>
</svg>
